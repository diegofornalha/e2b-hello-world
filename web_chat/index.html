<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude E2B API</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { 
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 1rem;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 80px rgba(0,0,0,0.25);
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #f3f4f6;
        }
        h1 { 
            color: #667eea; 
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #10b981;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        textarea {
            width: 100%;
            padding: 1.25rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
            line-height: 1.6;
            transition: all 0.2s;
            background: #fafafa;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        textarea::placeholder {
            color: #9ca3af;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #5568d3 100%);
            color: white;
            border: none;
            padding: 0.875rem 2.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        button:hover::before {
            width: 300px;
            height: 300px;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled { 
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        button:disabled::before {
            display: none;
        }
        .hint {
            color: #6b7280;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .response {
            margin-top: 2rem;
            padding: 2rem;
            background: linear-gradient(to bottom, #fafafa 0%, #ffffff 100%);
            border: 2px solid #e5e7eb;
            border-left: 5px solid #667eea;
            border-radius: 12px;
            display: none;
            max-height: 75vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .response.show { 
            display: block;
        }
        .response::-webkit-scrollbar {
            width: 10px;
        }
        .response::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }
        .response::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 5px;
        }
        .response::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5568d3, #6b3fa0);
        }

        /* Markdown styles */
        .markdown-content {
            line-height: 1.7;
            color: #1f2937;
        }
        .markdown-content h1 { 
            font-size: 1.75rem; 
            margin: 1.5rem 0 1rem; 
            color: #1f2937; 
            font-weight: 700;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 0.5rem;
        }
        .markdown-content h2 { 
            font-size: 1.5rem; 
            margin: 1.25rem 0 0.75rem; 
            color: #374151; 
            font-weight: 600;
        }
        .markdown-content h3 { 
            font-size: 1.25rem; 
            margin: 1rem 0 0.5rem; 
            color: #4b5563; 
            font-weight: 600;
        }
        .markdown-content h4 { 
            font-size: 1.1rem; 
            margin: 0.875rem 0 0.5rem; 
            color: #6b7280; 
            font-weight: 600;
        }
        .markdown-content p { 
            margin: 0.875rem 0; 
            line-height: 1.7; 
        }
        .markdown-content ul, .markdown-content ol {
            margin: 0.75rem 0;
            padding-left: 2rem;
        }
        .markdown-content li { 
            margin: 0.4rem 0; 
            line-height: 1.6; 
        }
        .markdown-content ul ul, .markdown-content ol ol,
        .markdown-content ul ol, .markdown-content ol ul {
            margin: 0.5rem 0;
        }
        .markdown-content strong {
            font-weight: 600;
            color: #1f2937;
        }
        .markdown-content em {
            font-style: italic;
        }
        .markdown-content code {
            background: #e5e7eb;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.9em;
            color: #dc2626;
        }
        .markdown-content pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1.25rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid #374151;
        }
        .markdown-content pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: 0.9em;
            display: block;
        }
        .markdown-content blockquote {
            border-left: 4px solid #667eea;
            margin: 1rem 0;
            padding: 0.75rem 1rem;
            background: #f3f4f6;
            border-radius: 4px;
            color: #4b5563;
        }
        .markdown-content blockquote p {
            margin: 0.5rem 0;
        }
        .markdown-content hr {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 1.5rem 0;
        }
        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
            font-size: 0.95em;
        }
        .markdown-content th, .markdown-content td {
            border: 1px solid #e5e7eb;
            padding: 0.75rem;
            text-align: left;
        }
        .markdown-content th {
            background: #f3f4f6;
            font-weight: 600;
            color: #1f2937;
        }
        .markdown-content tr:nth-child(even) {
            background: #f9fafb;
        }
        .markdown-content a {
            color: #667eea;
            text-decoration: none;
        }
        .markdown-content a:hover {
            text-decoration: underline;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #667eea;
            font-weight: 500;
            padding: 1rem;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-right-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-message {
            background: #fef2f2;
            border: 2px solid #fecaca;
            border-left: 5px solid #ef4444;
            color: #991b1b;
            padding: 1.25rem;
            border-radius: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .error-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        @media (max-width: 640px) {
            body {
                padding: 0.5rem;
            }
            .container {
                padding: 1.5rem;
                border-radius: 16px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .response {
                padding: 1.25rem;
                max-height: 60vh;
            }
            button {
                width: 100%;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Claude E2B API</h1>
            <p class="status">
                <span class="status-dot"></span>
                Online - Rodando em sandbox E2B isolado
            </p>
        </div>

        <div class="input-group">
            <textarea id="msg" placeholder="Digite sua pergunta ou mensagem aqui..."></textarea>
        </div>

        <div class="button-group">
            <button id="btn" onclick="send()">Enviar</button>
            <span class="hint">Pressione Ctrl+Enter para enviar</span>
        </div>

        <div id="resp" class="response">
            <div id="content" class="markdown-content"></div>
        </div>
    </div>

    <script>
        // Configurar marked com opções melhoradas
        marked.setOptions({
            breaks: true,           // Quebras de linha viram <br>
            gfm: true,             // GitHub Flavored Markdown
            headerIds: true,       // IDs nos headers
            mangle: false,         // Não modificar emails
            pedantic: false,       // Não ser pedante
            sanitize: false,       // Permitir HTML
            smartLists: true,      // Listas inteligentes
            smartypants: false,    // Aspas inteligentes
            xhtml: false           // Não usar XHTML
        });

        async function send() {
            const msgInput = document.getElementById('msg');
            const msg = msgInput.value.trim();
            
            if (!msg) {
                msgInput.focus();
                msgInput.style.borderColor = '#ef4444';
                setTimeout(() => {
                    msgInput.style.borderColor = '#e5e7eb';
                }, 2000);
                return;
            }

            const btn = document.getElementById('btn');
            const resp = document.getElementById('resp');
            const content = document.getElementById('content');

            // Desabilitar input e botão
            btn.disabled = true;
            msgInput.disabled = true;
            btn.textContent = 'Processando...';
            btn.style.cursor = 'wait';

            // Mostrar loading
            resp.classList.add('show');
            content.innerHTML = '<div class="loading"><div class="spinner"></div>Processando no sandbox E2B isolado...</div>';

            // Scroll para resposta
            setTimeout(() => {
                resp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP ${res.status}: ${errorText || res.statusText}`);
                }
                
                const data = await res.json();

                if (!data.response) {
                    throw new Error('Resposta vazia do servidor');
                }

                // Renderizar markdown
                const html = marked.parse(data.response);
                content.innerHTML = html;

                // Aplicar syntax highlighting em blocos de código
                content.querySelectorAll('pre code').forEach((block) => {
                    try {
                        hljs.highlightElement(block);
                    } catch (e) {
                        console.warn('Erro ao destacar código:', e);
                    }
                });

                // Scroll suave para o topo da resposta
                setTimeout(() => {
                    resp.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);

            } catch (err) {
                console.error('Erro:', err);
                content.innerHTML = `
                    <div class="error-message">
                        <span class="error-icon">⚠️</span>
                        <div>
                            <strong>Erro ao processar requisição:</strong><br>
                            ${err.message || 'Erro desconhecido'}
                        </div>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                msgInput.disabled = false;
                btn.textContent = 'Enviar';
                btn.style.cursor = 'pointer';
            }
        }

        // Enviar com Ctrl+Enter ou Cmd+Enter (Mac)
        const msgInput = document.getElementById('msg');
        msgInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                send();
            }
        });

        // Focar no textarea ao carregar
        window.addEventListener('load', () => {
            msgInput.focus();
        });
    </script>
</body>
</html>
